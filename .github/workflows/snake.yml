name: Contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#ff3d8a&color_dots=#ebedf0,#ffe0b2,#ffb347,#ff7a1a,#ff3d8a
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffb347&color_dots=#161b22,#2b1f4d,#5b3df5,#ff3d8a,#ffb347

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
