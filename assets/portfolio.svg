<svg xmlns="http://www.w3.org/2000/svg" width="580" height="356" viewBox="0 0 580 356" role="img" aria-label="Where the repos go">
<title>Where the repos go</title>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
