<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" role="img" aria-label="Selected work">
<title>Selected work</title>
<style>
@font-face { font-family: PU; src: url(data:font/woff2;base64,) format("woff2"); }
.u { font-family: PU, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 19px; fill: #59636E; }
</style>
<defs>
<filter id="r0" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="0.01"><animate attributeName="stdDeviation" dur="0.300s" values="2;2;0.01" keyTimes="0;0.0000;1" calcMode="spline" keySplines="0 0 1 1;.22 1 .36 1" fill="freeze"/></feGaussianBlur></filter>
</defs>
<text class="u" x="4" y="50" filter="url(#r0)">Selected work<animate attributeName="opacity" dur="0.300s" values="0;0;1" keyTimes="0;0.0000;1" calcMode="spline" keySplines="0 0 1 1;.22 1 .36 1" fill="freeze"/><set attributeName="filter" to="none" begin="0.300s"/></text>
</svg>
