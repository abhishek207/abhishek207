<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Commits per month">
<title>Commits per month</title>
<defs>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffb347" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#ff3d8a" stop-opacity=".18"/>
    <stop offset="1" stop-color="#7b61ff" stop-opacity=".5"/>
  </linearGradient>
  <radialGradient id="glow" cx=".1" cy="0" r="1">
    <stop offset="0" stop-color="#7b61ff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#0d0b1f" stop-opacity="0"/>
  </radialGradient>
</defs>
<style>
  text { font-family: 'Space Grotesk','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif; fill: #fff4e6; }
  .eyebrow { font-family: 'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace; font-size: 11px; letter-spacing: 2px; fill: #ffb347; }
  .h { font-size: 20px; font-weight: 700; }
  .muted { fill: #b7afc4; font-size: 12px; }
  .fade { opacity: 0; animation: fade .7s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
  
  .grow { transform-box: fill-box; transform-origin: bottom; animation: grow .8s cubic-bezier(.2,.7,.2,1) both; }
  @keyframes grow { from { transform: scaleY(0); } }

</style>
<rect x=".5" y=".5" width="1199" height="329" rx="18" fill="#0d0b1f"/>
<rect x=".5" y=".5" width="1199" height="329" rx="18" fill="url(#glow)"/>
<rect x=".5" y=".5" width="1199" height="329" rx="18" fill="none" stroke="url(#edge)"/>

<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7b61ff"/><stop offset="1" stop-color="#7b61ff" stop-opacity=".35"/></linearGradient>
  <linearGradient id="bar-hot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff3d8a"/></linearGradient>
</defs>
<text x="32" y="44" class="eyebrow">SHIPPING RHYTHM</text>
<text x="32" y="72" class="h">1,128 commits in the last 12 months</text>
<text x="1168" y="72" text-anchor="end" class="muted">commits per month on default branches, Nov 2025 to 20 Oct 2026</text>
